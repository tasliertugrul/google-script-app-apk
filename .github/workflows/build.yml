name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platform-tools'

    - name: Download Gradle Wrapper
      run: |
        curl -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
        curl -L -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/master/gradlew.bat
        mkdir -p gradle/wrapper
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
        # GRADLE 8.0 SÜRÜMÜNÜ DOĞRUDAN İNDİRİYORUZ
        curl -L -o gradle/wrapper/gradle-wrapper.properties https://services.gradle.org/distributions/gradle-8.0-bin.zip
        chmod +x gradlew
        # İndirdiğimiz zip dosyasını açıp wrapper klasörüne yerleştiriyoruz
        unzip -o gradle-8.0-bin.zip -d gradle/
        mv gradle/gradle-8.0 gradle/wrapper/gradle-8.0

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk